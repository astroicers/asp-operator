name: ASP Operator — Poll Issues

on:
  # ⏸️ FROZEN (AI-SOP-Protocol ADR-032, 2026-08-05)：排程輪詢已停用，operator 感知層凍結。
  # 解凍：取消下列 schedule 註解即可（workflow_dispatch 保留供手動測試/解凍驗證）。
  # schedule:
  #   - cron: '*/30 * * * *'
  workflow_dispatch:

# The built-in GITHUB_TOKEN is unused (the operator authenticates via a GitHub
# App installation token, see ADR-001). Kept minimal.
permissions:
  contents: read

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Mint a short-lived (1h) installation token from the ASP-Operator GitHub
      # App. Scoped to all repos the App is installed on under `owner`. The
      # token is fed into the existing OPERATOR_GITHUB_TOKEN interface — only
      # its source changed (classic PAT -> App token). See ADR-001.
      - name: Mint GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.ASP_OPERATOR_APP_ID }}
          private-key: ${{ secrets.ASP_OPERATOR_APP_PRIVATE_KEY }}
          owner: astroicers

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -v
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Poll GitHub Issues
        run: python -m src.poll_issues
        env:
          OPERATOR_GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          PYTHONPATH: ${{ github.workspace }}
