version: "1.0"

authorized_owners:
  - "astroicers"

# Token 介面（值由 GitHub App installation token 填入；非 classic PAT）。
# 設定見 docs/github-app-setup.md，決策見 docs/adr/ADR-001-github-app-auth.md
github_token_env: "OPERATOR_GITHUB_TOKEN"

defaults:
  label_filter: ["ready-for-agent"]
  priority_map:
    P0: ["critical", "urgent"]
    P1: ["high"]
    P2: ["medium"]
    P3: ["low"]
  sla_hours_map:
    P0: 0
    P1: 24
    P2: 72
    P3: 168
